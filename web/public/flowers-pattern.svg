<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="flowersPattern" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <!-- Flower 1 - Top Left -->
      <g transform="translate(50, 50)" opacity="0.28">
        <circle cx="0" cy="0" r="3" fill="#E085A0"/>
        <circle cx="-6" cy="-4" r="2.5" fill="#F0A8B8"/>
        <circle cx="6" cy="-4" r="2.5" fill="#F0A8B8"/>
        <circle cx="-6" cy="4" r="2.5" fill="#F0A8B8"/>
        <circle cx="6" cy="4" r="2.5" fill="#F0A8B8"/>
        <circle cx="0" cy="-6" r="2.5" fill="#F0A8B8"/>
        <circle cx="0" cy="6" r="2.5" fill="#F0A8B8"/>
      </g>

      <!-- Flower 2 - Top Right -->
      <g transform="translate(250, 80)" opacity="0.24">
        <circle cx="0" cy="0" r="2.5" fill="#E085A0"/>
        <circle cx="-5" cy="-3" r="2" fill="#F0A8B8"/>
        <circle cx="5" cy="-3" r="2" fill="#F0A8B8"/>
        <circle cx="-5" cy="3" r="2" fill="#F0A8B8"/>
        <circle cx="5" cy="3" r="2" fill="#F0A8B8"/>
        <circle cx="0" cy="-5" r="2" fill="#F0A8B8"/>
        <circle cx="0" cy="5" r="2" fill="#F0A8B8"/>
      </g>

      <!-- Flower 3 - Middle -->
      <g transform="translate(150, 150)" opacity="0.30">
        <circle cx="0" cy="0" r="3.5" fill="#E085A0"/>
        <circle cx="-7" cy="-5" r="2.8" fill="#F0A8B8"/>
        <circle cx="7" cy="-5" r="2.8" fill="#F0A8B8"/>
        <circle cx="-7" cy="5" r="2.8" fill="#F0A8B8"/>
        <circle cx="7" cy="5" r="2.8" fill="#F0A8B8"/>
        <circle cx="0" cy="-7" r="2.8" fill="#F0A8B8"/>
        <circle cx="0" cy="7" r="2.8" fill="#F0A8B8"/>
      </g>

      <!-- Flower 4 - Bottom Left -->
      <g transform="translate(70, 250)" opacity="0.26">
        <circle cx="0" cy="0" r="2" fill="#E085A0"/>
        <circle cx="-4" cy="-2.5" r="1.5" fill="#F0A8B8"/>
        <circle cx="4" cy="-2.5" r="1.5" fill="#F0A8B8"/>
        <circle cx="-4" cy="2.5" r="1.5" fill="#F0A8B8"/>
        <circle cx="4" cy="2.5" r="1.5" fill="#F0A8B8"/>
        <circle cx="0" cy="-4" r="1.5" fill="#F0A8B8"/>
        <circle cx="0" cy="4" r="1.5" fill="#F0A8B8"/>
      </g>

      <!-- Flower 5 - Bottom Right -->
      <g transform="translate(270, 220)" opacity="0.25">
        <circle cx="0" cy="0" r="2.5" fill="#E085A0"/>
        <circle cx="-5" cy="-3.5" r="2" fill="#F0A8B8"/>
        <circle cx="5" cy="-3.5" r="2" fill="#F0A8B8"/>
        <circle cx="-5" cy="3.5" r="2" fill="#F0A8B8"/>
        <circle cx="5" cy="3.5" r="2" fill="#F0A8B8"/>
        <circle cx="0" cy="-5" r="2" fill="#F0A8B8"/>
        <circle cx="0" cy="5" r="2" fill="#F0A8B8"/>
      </g>

      <!-- Leaf 1 -->
      <ellipse cx="100" cy="120" rx="2" ry="5" fill="#B8A968" transform="rotate(-30 100 120)" opacity="0.18"/>
      
      <!-- Leaf 2 -->
      <ellipse cx="200" cy="200" rx="1.5" ry="4" fill="#B8A968" transform="rotate(45 200 200)" opacity="0.16"/>
      
      <!-- Leaf 3 -->
      <ellipse cx="50" cy="200" rx="2" ry="5" fill="#B8A968" transform="rotate(-60 50 200)" opacity="0.20"/>
    </pattern>
  </defs>
  
  <rect width="300" height="300" fill="url(#flowersPattern)"/>
</svg>
